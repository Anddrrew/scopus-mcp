name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Validate only; do not create a tag, release, or npm publication'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main has moved. Start a new release run from main."
            exit 1
          }
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version)) {
            throw new Error('The current package version must be stable.');
          }
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package.json and package-lock.json versions must match.');
          }
          JS
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          version=$(node -p "require('./package.json').version")
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "Tag v$version already exists. Resolve the existing release before starting another."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "## Planned release: v$version ($BUMP)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:run
      - name: Build release archive
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Validate publication without publishing
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --dry-run --access public --ignore-scripts
      - name: Commit version and push release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          # Both refs update together. A concurrent main push rejects the release.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"
      - name: Publish to npm with trusted publishing
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" \
            --verify-tag --generate-notes --title "v$RELEASE_VERSION"
