name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in package.json (e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Validate only; do not create a tag, release, or npm publication'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Use a stable version such as 0.1.0, without a v prefix.');
          }
          if (pkg.version !== version || lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('Update package.json and package-lock.json in a PR before releasing.');
          }
          JS
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || {
              echo "Tag $tag already points to a different commit."
              exit 1
            }
          fi
      - run: npm ci
      - run: npm run check
      - name: Build release archive
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Validate publication without publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --dry-run --access public --ignore-scripts
      - name: Create immutable release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag "$tag" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$tag"
      - name: Publish to npm with trusted publishing
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" \
            --verify-tag --generate-notes --title "v$RELEASE_VERSION"
