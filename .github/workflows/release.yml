name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Validate only; do not create a release PR'
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin main --tags
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
            test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
              echo "main has moved. Start a new release run from main."
              exit 1
            }
          else
            git merge-base --is-ancestor HEAD origin/main
          fi
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version)) {
            throw new Error('The current package version must be stable.');
          }
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package.json and package-lock.json versions must match.');
          }
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          const artifact = server.packages?.[0];
          if (server.name !== pkg.mcpName || server.version !== pkg.version ||
              server.packages?.length !== 1 || artifact.registryType !== 'npm' ||
              artifact.identifier !== pkg.name || artifact.version !== pkg.version) {
            throw new Error('MCP Registry metadata must match the npm package name and version.');
          }
          JS
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            npm version "$BUMP" --no-git-tag-version --ignore-scripts
            jq --arg version "$(node -p "require('./package.json').version")" \
              '.version = $version | .packages[0].version = $version' server.json > "$RUNNER_TEMP/server.json"
            mv "$RUNNER_TEMP/server.json" server.json
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$RELEASE_BRANCH" = "release/v$version" || {
              echo "The merged release branch must match the package version."
              exit 1
            }
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            test "$GITHUB_EVENT_NAME" = pull_request &&
              test "$(git rev-parse "v$version^{commit}")" = "$(git rev-parse HEAD)" || {
                echo "Tag v$version already exists for another release."
                exit 1
              }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "## Release: v$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:run
      - name: Install MCP Publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          mkdir -p mcp-publisher-bin
          tar -xzf mcp-publisher.tar.gz -C mcp-publisher-bin mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher-bin" >> "$GITHUB_PATH"
      - name: Validate MCP Registry metadata
        run: mcp-publisher validate server.json
      - name: Build release archive
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Validate publication without publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --dry-run --access public --ignore-scripts
      - name: Open release pull request
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$RELEASE_VERSION"
          existing_pr=$(gh pr list --base main --state open --limit 100 \
            --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("release/v"))][0].url // empty')
          if [ -n "$existing_pr" ]; then
            echo "Release PR already exists: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add package.json package-lock.json server.json
          git commit -m "chore: release v$RELEASE_VERSION"
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_branch" ]; then
            git fetch origin "$branch"
            git diff --exit-code HEAD FETCH_HEAD
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          cat > "$RUNNER_TEMP/release-pr.md" <<'BODY'
          Updates the package, lockfile, and MCP Registry metadata versions.

          Approve the CI workflow run if GitHub requests it, then merge this PR
          after the checks pass. Merging starts publication from the merge commit:
          the Release workflow creates the version tag, publishes to npm and
          the MCP Registry, and creates the GitHub release.
          BODY
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "chore: release v$RELEASE_VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md")
          echo "Release PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Push release tag
        if: github.event_name == 'pull_request'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git tag "v$RELEASE_VERSION"
            git push origin "refs/tags/v$RELEASE_VERSION"
          fi
      - name: Check whether the archive is already published
        if: github.event_name == 'pull_request'
        id: published
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const response = await fetch(`https://registry.npmjs.org/scopus-mcp/${version}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
          } else {
            if (!response.ok) {
              throw new Error(`npm registry returned HTTP ${response.status}`);
            }
            const published = await response.json();
            const archive = readFileSync(`${process.env.RUNNER_TEMP}/scopus-mcp-${version}.tgz`);
            const integrity = `sha512-${createHash('sha512').update(archive).digest('base64')}`;
            if (published.dist?.integrity !== integrity) {
              throw new Error('This version is already published with a different archive.');
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
          }
          JS
      - name: Publish to npm with trusted publishing
        if: github.event_name == 'pull_request' && steps.published.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
      - name: Publish to MCP Registry
        if: github.event_name == 'pull_request'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(jq -r '.name | @uri' server.json)
          status=$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/registry.json" --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$RELEASE_VERSION?include_deleted=true")
          case "$status" in
            404)
              mcp-publisher login github-oidc
              for attempt in 1 2 3 4 5; do
                if mcp-publisher publish server.json > "$RUNNER_TEMP/mcp-publish.log" 2>&1; then
                  cat "$RUNNER_TEMP/mcp-publish.log"
                  break
                fi
                cat "$RUNNER_TEMP/mcp-publish.log"
                if [ "$attempt" -eq 5 ] || ! grep -Fq 'A newly published release can take a moment to appear on the registry' "$RUNNER_TEMP/mcp-publish.log"; then
                  exit 1
                fi
                echo "npm version is not visible to the MCP Registry yet; retrying in 30 seconds."
                sleep 30
              done
              ;;
            200)
              jq -e --slurpfile expected server.json \
                '.server == $expected[0] and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
                "$RUNNER_TEMP/registry.json" > /dev/null || {
                  echo "This Registry version already exists with different metadata or is inactive."
                  exit 1
                }
              ;;
            *) echo "MCP Registry returned HTTP $status"; exit 1 ;;
          esac
      - name: Create GitHub release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" \
              "$RUNNER_TEMP/scopus-mcp-$RELEASE_VERSION.tgz" \
              --verify-tag --generate-notes --title "v$RELEASE_VERSION"
          fi
