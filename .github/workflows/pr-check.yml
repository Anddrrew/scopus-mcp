name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check:
    name: Check (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify npm packaging
        run: npm pack --dry-run
